[package]
name = "docs-gate"
version = "0.1.0"
edition = "2024"
description = "CLI tool to check docs compliance before commit — CHANGELOG, ARCHITECTURE, Discovery Reports"
license = "MIT"
repository = "https://github.com/aspelldenny/docs-gate"homepage = "https://github.com/aspelldenny/docs-gate"keywords = ["documentation", "linting", "changelog", "architecture", "cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
regex = "1"
chrono = "0.4"
tokio = { version = "1", features = ["rt", "macros", "signal", "sync", "time"] }
notify = "8"
rmcp = { version = "0.8", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
libc = "0.2"
